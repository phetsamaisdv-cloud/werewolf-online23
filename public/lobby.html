<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werewolf Online — Lobby</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="container" id="lobbyRoot" hidden>
    <header class="hero">
      <h1>Lobby</h1>
      <div class="room-code">
        <span class="room-code__label">รหัสห้อง</span>
        <span class="room-code__value" id="roomCodeValue">----</span>
        <button id="copyCodeBtn" class="btn btn--ghost" type="button">คัดลอก</button>
      </div>
    </header>

    <section class="card">
      <div class="section-head">
        <h2>ผู้เล่น</h2>
        <span class="badge" id="playerCount">0/16</span>
      </div>
      <ul class="player-list" id="playerList"></ul>
    </section>

    <section class="card">
      <p id="statusMsg" class="muted">กำลังโหลดห้อง...</p>
      <div class="btn-group" id="hostControls" hidden>
        <button id="startBtn" class="btn" disabled>เริ่มเกม</button>
      </div>
    </section>

    <section class="card" id="roleCardArea" hidden>
      <div id="roleCard" class="role-card"></div>
      <a class="btn" id="goPlayerBtn" href="#">ไปหน้าผู้เล่น</a>
    </section>

    <footer class="links">
      <a id="leaveLink" href="index.html">ออกจากห้อง</a>
    </footer>
  </main>

  <!-- importmap: แก้ bare import จาก firebase/... ให้ชี้ไป CDN -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"
      }
    }
  </script>
  <script type="module" src="src/lobby-ui.js"></script>
</body>
</html>
