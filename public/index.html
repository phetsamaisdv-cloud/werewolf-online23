<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/ui/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werewolf Online — สร้าง/เข้าห้อง</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>Werewolf Online</h1>
      <p class="muted">เกมสืบหาใครคือหมาป่า</p>
    </header>

    <section class="card">
      <label class="field" for="playerName">ชื่อของคุณ</label>
      <input id="playerName" type="text" maxlength="20" placeholder="ใส่ชื่อผู้เล่น" autocomplete="nickname">
      <p id="nameError" class="error" hidden></p>

      <div class="btn-group">
        <button id="createRoomBtn" class="btn">สร้างห้อง</button>
      </div>

      <div class="divider"><span>หรือ</span></div>

      <div class="row">
        <input id="roomCode" type="text" inputmode="numeric" maxlength="4"
               placeholder="รหัส 4 หลัก" aria-label="รหัสห้อง">
        <button id="joinRoomBtn" class="btn btn--wolf">เข้าห้อง</button>
      </div>
      <p id="roomError" class="error" hidden></p>
    </section>

    <footer class="links">
      <a href="help.html">กติกา</a>
      <a href="profile.html">โปรไฟล์</a>
      <a href="settings.html">ตั้งค่า</a>
    </footer>
  </main>

  <!-- importmap: แก้ bare import จาก firebase/... ให้ชี้ไป CDN (ไม่ต้องใช้ bundler) -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"
      }
    }
  </script>
  <script type="module" src="src/index-ui.js"></script>
</body>
</html>
